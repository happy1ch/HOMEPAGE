name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '17 12 * * 6'  # 토 21:17 KST — 주일 예약 라이브 미리 반영
    - cron: '47 0 * * 0'   # 일 09:47 KST — 주일 라이브 반영
    - cron: '30 2 * * 0'   # 일 11:30 KST — 오전예배 시작
    - cron: '0  5 * * 0'   # 일 14:00 KST — 오전예배 녹화 반영
    - cron: '0  8 * * 0'   # 일 17:00 KST — 오후예배 녹화 반영
    - cron: '37 9 * * 3'   # 수 18:37 KST — 수요 라이브 반영
    - cron: '30 13 * * 3'  # 수 22:30 KST — 수요예배 녹화 반영
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update sermon video (schedule / manual only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          RSS=$(curl -s "https://www.youtube.com/feeds/videos.xml?channel_id=UC2seq9scvYNM-_Inf3AFmag")
          VIDEO_ID=$(echo "$RSS" | grep -o '<yt:videoId>[^<]*' | sed 's/<yt:videoId>//' | head -1)
          echo "Latest video: $VIDEO_ID"
          if [ -z "$VIDEO_ID" ]; then echo "No video id found, skip"; exit 0; fi
          export VIDEO_ID RSS
          python3 - <<'EOF'
          import re, os
          from datetime import datetime, timedelta
          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()
          vid = os.environ['VIDEO_ID']
          content = re.sub(
              r'src="https://www\.youtube\.com/embed/[^"]*"',
              f'src="https://www.youtube.com/embed/{vid}?rel=0&modestbranding=1"',
              content
          )
          # 최근 설교 4편 카드 갱신 (같은 설교의 중복 업로드는 제목 앞 5글자로 걸러냄)
          rss = os.environ.get('RSS', '')
          cards, seen = [], set()
          for e in re.findall(r'<entry>(.*?)</entry>', rss, re.S):
              m_id = re.search(r'<yt:videoId>([^<]+)', e)
              m_t = re.search(r'<title>([^<]*)', e)
              m_p = re.search(r'<published>([^<]+)', e)
              if not (m_id and m_t and m_p):
                  continue
              title = m_t.group(1)
              key = re.sub(r'[^가-힣]', '', re.sub(r'&[a-z]+;', '', title))[:5]
              if key in seen:
                  continue
              seen.add(key)
              d = datetime.fromisoformat(m_p.group(1)) + timedelta(hours=9)
              vid_i = m_id.group(1)
              cards.append(
                  f'        <a class="sermon-card" href="https://www.youtube.com/watch?v={vid_i}" target="_blank" rel="noopener">'
                  f'<img src="https://i.ytimg.com/vi/{vid_i}/hqdefault.jpg" alt="" loading="lazy" decoding="async" />'
                  f'<div class="sermon-body"><h3>{title}</h3><p>{d:%Y.%m.%d}</p></div></a>'
              )
              if len(cards) == 4:
                  break
          if cards:
              content = re.sub(
                  r'(<!-- SERMONS:START[^>]*-->\n).*?(\n\s*<!-- SERMONS:END -->)',
                  lambda m: m.group(1) + '\n'.join(cards) + m.group(2),
                  content, flags=re.S
              )
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(content)
          print(f'Sermon updated to: {vid}, recent cards: {len(cards)}')
          EOF

      # 새 영상 ID를 저장소에 커밋 -> 저장소 활동이 생겨 GitHub가 60일 무활동으로 워크플로를 끄는 것을 방지
      - name: Commit updated video id (keepalive)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet index.html; then
            git add index.html
            git commit -m "chore: 최신 설교 영상 반영"
          fi
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          if [ $(( (NOW - LAST) / 86400 )) -ge 30 ]; then
            git commit --allow-empty -m "chore: keepalive"
          fi
          git push || echo "push skipped"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
